[package]
edition = "2024"
name = "fbkl-server"
version = "0.1.0"

[lib]
name = "fbkl_server"
path = "src/lib.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-graphql = {version = "7.2.1", features = ["dataloader"]}
async-graphql-axum = "7.2.1"
axum = {version = "0.8.9"}
axum-macros = "0.5.1"
chrono = "0.4"
color-eyre = "0.6.5"
dotenv = "0.15.0"
fbkl-auth = {path = "../auth"}
fbkl-constants = {path = "../constants"}
fbkl-entity = {path = "../entity"}
fbkl-jobs = {path = "../jobs"}
fbkl-logic = {path = "../logic"}
fbkl-transaction-processor = {path = "../transaction-processor"}
serde = {version = "1.0.228", features = ["derive"]}
serde_json = "1.0.150"
sha2 = "0.11.0"
thiserror = "2.0.12"
time = "0.3.47"
tokio = {version = "1.52.3", features = ["full"]}
tower-cookies = "0.11.0"
tower-sessions = {version = "0.15.0", features = ["private"]}
# Unreleased: first revision on sqlx 0.9, so the store shares sea-orm 2's pool.
tower-sessions-sqlx-store = {git = "https://github.com/maxcountryman/tower-sessions-stores.git", rev = "75cb75792d0a8d9231723b07e7524897201ef73b", features = ["postgres"]}
tracing = "0.1.44"
tracing-subscriber = {version = "0.3.23", features = ["env-filter", "fmt"]}

[dev-dependencies]
fbkl-test-support = {path = "../test-support"}

[lints]
workspace = true
