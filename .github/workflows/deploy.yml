# Continuous deployment on push to main (epic fbkl-rust-96e.10).
#
# agents-allow-block — workflow header
# Path-filtered, except `migrate`: it runs on EVERY deploy and applies whatever
# is pending. Never path-filter it — the pending set depends on what the DB has
# applied, not on what this push changed, so one failed migration would stay
# unapplied while every later push went green. Lambdas deploy via OIDC (no
# stored AWS keys); frontends deploy to Cloudflare Pages via wrangler.
#
# Required repo config:
#   Variables: AWS_DEPLOY_ROLE_ARN (= tofu output github_deploy_role_arn),
#              AWS_REGION (us-east-1), CLOUDFLARE_ACCOUNT_ID
#   Secrets:   PROD_DATABASE_MIGRATION_URL (Supabase session pooler — DDL-safe + IPv4), CLOUDFLARE_API_TOKEN
#   Environment `production`: leave required reviewers OFF, or approve every push.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Deploy lambdas + both frontends regardless of changed paths'
        type: boolean
        default: true

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      app: ${{ steps.filter.outputs.app }}
      public: ${{ steps.filter.outputs.public }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'server/**'
              - 'lambdas/**'
              - 'logic/**'
              - 'entity/**'
              - 'auth/**'
              - 'constants/**'
              - 'jobs/**'
              - 'transaction-processor/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            app:
              - 'webapp-logged-in/**'
            public:
              - 'webapp-public/**'

  migrate:
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_MIGRATION_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-x86-debug
      - run: cargo run -p fbkl-migration -- up
      - run: cargo run -p fbkl-server --bin migrate_sessions

  deploy-lambdas:
    needs: [changes, migrate]
    if: needs.changes.outputs.rust == 'true' || github.event.inputs.force == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-lambda-arm64
      - run: pipx install cargo-lambda
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.14.0
      - run: cargo lambda build --release --arm64 --output-format zip
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Update function code
        run: |
          for fn in fbkl-api fbkl-scheduler fbkl-session-gc; do
            aws lambda update-function-code \
              --function-name "$fn" \
              --zip-file "fileb://target/lambda/$fn/bootstrap.zip" \
              --publish
          done

  deploy-app:
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event.inputs.force == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp-logged-in
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-x86-debug
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: cargo run -p fbkl-graphql-generation
      - run: pnpm --filter "@fbkl/webapp-logged-in" build
        working-directory: .
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest pages deploy dist --project-name=fbkl --branch=main

  deploy-public:
    needs: changes
    if: needs.changes.outputs.public == 'true' || github.event.inputs.force == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp-public
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm --filter "@fbkl/webapp-public" build
        working-directory: .
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest pages deploy dist --project-name=fbkl-public --branch=main
