# Path-filtered PR checks; logged-in typecheck runs the Rust schema generator before tsc (generated GraphQL types).
name: ci

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'auth/**'
              - 'constants/**'
              - 'entity/**'
              - 'graphql-generation/**'
              - 'jobs/**'
              - 'lambdas/**'
              - 'logic/**'
              - 'migration/**'
              - 'server/**'
              - 'test-support/**'
              - 'transaction-processor/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            frontend:
              - 'webapp-logged-in/**'
              - 'webapp-public/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              # Schema-affecting Rust changes can break generated frontend types.
              - 'graphql-generation/**'
              - 'server/**'

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    services:
      # Without this, every scratch-DB integration test skips itself and the job passes vacuously.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      # Each test drops, creates and migrates its own `fbkl_test_<name>` database next to this
      # one, so the job needs no separate migration step.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      FBKL_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-clippy-test
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo fmt --all --check
      # clippy compiles the workspace, so it subsumes `cargo check`.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace
      # nextest cannot run doctests; separate step so they don't silently stop running.
      - run: cargo test --doc --workspace

  lint:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - run: pnpm lint

  typecheck-logged-in:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-graphql-gen
      - uses: ./.github/actions/setup-node
      - run: cargo run -p fbkl-graphql-generation
      - run: pnpm --filter "@fbkl/webapp-logged-in" build

  typecheck-public:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - run: pnpm --filter "@fbkl/webapp-public" exec tsc
